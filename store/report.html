<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SenAnnotate — the report</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 1280px; height: 800px; padding: 54px 64px;
        background: #171b26; color: #e7ebf3;
        font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column;
      }
      h1 { font-size: 27px; font-weight: 690; letter-spacing: -0.025em; margin: 0 0 7px; }
      p.lead { color: #a8b2c4; margin: 0 0 26px; font-size: 16.5px; }
      .accent { color: #fb923c; }

      .window {
        flex: 1; min-height: 0; display: flex; flex-direction: column;
        background: #0f1219; border: 1px solid #2b3243; border-radius: 12px; overflow: hidden;
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.36);
      }
      .bar {
        display: flex; align-items: center; gap: 8px;
        padding: 11px 15px; border-bottom: 1px solid #232a39; background: #141824;
      }
      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .bar .name {
        margin-left: 9px; color: #8b96a9;
        font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Sized so the whole report fits without scrolling — including the failed-request
         line, which is where the credential redaction shows. */
      pre {
        margin: 0; padding: 18px 24px; overflow: hidden; flex: 1;
        font: 12.5px/1.62 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; color: #cdd5e2;
      }
      /* Markdown, lightly coloured so the structure reads at a glance. */
      .md-h { color: #93a1b8; font-weight: 600; }
      .md-k { color: #fdba74; }
    </style>
  </head>
  <body>
    <h1>One copy, and your agent knows <span class="accent">exactly</span> what you meant</h1>
    <p class="lead">Real output — generated by the extension, not written for this screenshot.</p>

    <div class="window">
      <div class="bar">
        <span class="dot" style="background: #ff5f57"></span>
        <span class="dot" style="background: #febc2e"></span>
        <span class="dot" style="background: #28c840"></span>
        <span class="name">page-feedback.md — pasted from the clipboard</span>
      </div>
      <pre id="out"></pre>
    </div>
  </body>
</html>
