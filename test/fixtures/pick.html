<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pick fixture</title>
    <style>
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; height: 700px; position: relative; }
      /* Far apart on purpose: the point of picking one at a time is the case no single
         rectangle covers without covering half the page too. */
      .badge { position: absolute; right: 24px; top: 20px; padding: 4px 10px; background: #fee2e2; }
      .label { position: absolute; left: 40px; top: 320px; }
      .submit { position: absolute; left: 40px; bottom: 40px; padding: 8px 14px; }
    </style>
  </head>
  <body>
    <h1 style="padding: 20px">Pick fixture</h1>
    <span class="badge">Beta</span>
    <label class="label">Card number</label>
    <button class="submit">Place order</button>
  </body>
</html>
