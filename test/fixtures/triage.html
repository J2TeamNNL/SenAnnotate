<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SenAnnotate fixture — triage</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font: 14px/1.5 system-ui, sans-serif;
      }
      .cta {
        padding: 8px 14px;
        border: 1px solid #d0d4da;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- A page of its own, deliberately.

         Annotations are stored per origin + pathname and `chrome.storage.local` is
         shared across every page in the test context, so reusing plain.html here
         inherited the note an earlier block left on it — and every count assertion
         in this section was then one too high. -->
    <main class="page">
      <h1 id="headline">Triage</h1>
      <p class="intro">Two things to annotate, one of each type.</p>
      <button class="cta">Click me</button>
    </main>
  </body>
</html>
