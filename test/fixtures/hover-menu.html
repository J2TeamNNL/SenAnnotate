<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SenAnnotate fixture — hover-only menu</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font: 14px/1.5 system-ui, sans-serif;
      }

      /* The whole point of the fixture: this menu exists only while the pointer is
         over the trigger. Clicking anything to annotate it destroys the state being
         annotated, which is what hover capture (the `C` key) is for.

         CSS-driven rather than JS-driven so it cannot flake on timing — there is no
         open/close animation and no event handler to race. */
      .menu {
        display: inline-block;
        position: relative;
      }

      .menu__list {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin: 4px 0 0;
        padding: 6px;
        list-style: none;
        min-width: 180px;
        border: 1px solid #d0d4da;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(15, 25, 40, 0.16);
      }

      .menu:hover .menu__list {
        display: block;
      }

      .menu__item {
        padding: 6px 10px;
        border-radius: 5px;
        cursor: pointer;
      }

      .menu__item:hover {
        background: #f4f5f7;
      }

      .menu__trigger {
        padding: 8px 14px;
        border: 1px solid #d0d4da;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 id="headline">Hover-only menu</h1>

      <div class="menu">
        <button class="menu__trigger">Account</button>
        <ul class="menu__list">
          <li class="menu__item" id="menu-profile">Your profile</li>
          <li class="menu__item" id="menu-billing">Billing settings</li>
          <li class="menu__item" id="menu-signout">Sign out</li>
        </ul>
      </div>

      <p class="intro">
        The menu closes the moment the pointer leaves the trigger, so a click-to-annotate
        flow can never reach its items.
      </p>
    </main>
  </body>
</html>
