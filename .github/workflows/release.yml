name: Release

on:
  push:
    tags: ["v*.*.*"]

# The default workflow token is read-only. Without this, `gh release create` fails with
# 403 — which reads like an auth problem rather than a missing permission.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Runs before `npm ci` so a mismatch costs seconds, not a full install.
      #
      # The tag is read through the GITHUB_REF_NAME environment variable rather than
      # ${{ github.ref_name }}. A `${{ }}` expression is substituted into the script
      # textually before the shell sees it, so a tag containing shell metacharacters
      # would execute; an environment variable is just a value. Same reason `gh release
      # create` quotes it below.
      #
      # `node -p` rather than jq: Node is already set up, jq is one more assumption.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json, or delete and re-push the tag."
            exit 1
          fi

      - run: npm ci

      - run: npm run pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" senannotate-*.zip --generate-notes

      # Ships the same zip to the Web Store. Runs after the GitHub release on purpose: the
      # release is ours and always succeeds, while this depends on Google, and a Store
      # outage should not cost us the release artifact.
      #
      # The script skips itself, exit 0, when none of these are set — so tagging keeps
      # working before the Store item exists — and fails loudly when only some are, which
      # is what a renamed or rotated secret looks like. Secrets stay scoped to this step
      # rather than the job, so nothing else in the run can read them.
      - name: Publish to the Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          # Set the repository variable CWS_UPLOAD_ONLY to "true" to upload without
          # submitting for review, when a release should reach the Store but wait.
          CWS_UPLOAD_ONLY: ${{ vars.CWS_UPLOAD_ONLY }}
        run: node scripts/publish-store.mjs
